<text x="50" y="807" font-size="12.5" font-weight="bold">Note:</text>
<text x="50" y="828" font-size="12.5" font-weight="normal">• KY-023 joystick: the pin marked +5V goes to the Pico's 3V3(OUT). With 5 V the VRx/VRy outputs exceed the 3.3 V allowed on the inputs.</text>
<text x="50" y="849" font-size="12.5" font-weight="normal">• 12×12 buttons: use two diagonally opposite pins (1 and 4). No resistors: the firmware enables the internal pull-ups. Button pressed = pin to GND.</text>
<text x="50" y="870" font-size="12.5" font-weight="normal">• The ground of the 4 buttons is a single wire daisy-chained from button to button to a Pico GND.</text>
<text x="50" y="891" font-size="12.5" font-weight="normal">• Wires soldered directly: on the joystick shorten the 90° pins to 3–4 mm; on the Pico solder the wires into the holes from the component side. 15 cm wires.</text>
<text x="50" y="912" font-size="12.5" font-weight="normal">• Firmware: Raspberry Pi Pico board (Earle Philhower package), sketch controller_pico.ino. First upload with BOOTSEL held down.</text>
<text x="50" y="933" font-size="12.5" font-weight="normal">• FUNCTION key (L3 held): +A = L1, +B = R1, +X = SELECT, +Y = START.  L3 held on its own for 5 s = recalibrates the stick centre.</text>
</svg>