<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1080" viewBox="0 0 1500 1080" font-family="DejaVu Sans, Arial, sans-serif">
<rect width="1500" height="1080" fill="#ffffff"/>
<text x="30" y="40" font-size="22" font-weight="bold">Slim USB controller — wiring (Raspberry Pi Pico, 1 joystick, 4 buttons)</text>
<text x="30" y="64" font-size="13" fill="#444">Block diagram. Pins with name and pin number on the Pico. Orange = 3.3 V, black = GND, colours = signals. Everything is powered from the Pico's USB socket.</text>
