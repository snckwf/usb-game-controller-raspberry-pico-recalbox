<text x="910" y="210" font-size="12">+5V</text>
<text x="992" y="210" font-size="10.5" fill="#d22">goes to 3V3(OUT), not to 5 V!</text>
<circle cx="900" cy="230" r="4.5" fill="#1f3a6e"/>
